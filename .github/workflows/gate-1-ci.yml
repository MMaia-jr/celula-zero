name: Gate 1 CI

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "supabase/**"
      - "scripts/check-gate1-contracts.mjs"
      - "package.json"
      - "package-lock.json"
      - "GATE-1-RESULT.md"
      - ".github/workflows/gate-1-ci.yml"
  push:
    branches:
      - "feat/mvp-001-gate-1"

permissions:
  contents: read

concurrency:
  group: gate-1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web, domain and portability
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Use Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install from lockfile
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and component tests
        run: npm run test
      - name: Domain contract checks
        run: npm run test:contracts
      - name: Production build
        run: npm run build
      - name: Install Chromium for local-only smoke tests
        run: npx playwright install --with-deps chromium
      - name: Public journey smoke tests
        run: npm run test:e2e
      - name: Preserve Playwright report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  database:
    name: PostgreSQL, RLS and authenticated journey
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Use Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install from lockfile
        run: npm ci
      - name: Install Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.115.0
      - name: Start isolated local stack
        run: supabase start
      - name: Reset from migrations and seed
        run: supabase db reset --local
      - name: Run pgTAP authorization tests
        run: supabase test db
      - name: Export public local test environment
        shell: bash
        run: |
          set -euo pipefail
          status_file="$(mktemp)"
          chmod 600 "$status_file"
          trap 'rm -f "$status_file"' EXIT
          supabase status -o env > "$status_file"
          set -a
          source "$status_file"
          set +a
          public_key="${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
          test -n "$public_key"
          {
            printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "${API_URL:-http://127.0.0.1:54321}"
            printf 'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "$public_key"
            printf 'NEXT_PUBLIC_SITE_URL=%s\n' "http://127.0.0.1:3000"
            printf 'LOCAL_MAILPIT_URL=%s\n' "${MAILPIT_URL:-${INBUCKET_URL:-http://127.0.0.1:54324}}"
          } >> "$GITHUB_ENV"
      - name: Install Chromium for authenticated local journey
        run: npx playwright install --with-deps chromium
      - name: Login, create, persist, reload and read anonymously
        run: npm run test:e2e:auth
      - name: Preserve authenticated Playwright evidence on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-auth-report
          path: |
            apps/web/playwright-report-auth/
            apps/web/test-results-auth/
          retention-days: 7
