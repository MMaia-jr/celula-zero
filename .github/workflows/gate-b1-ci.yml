name: Gate B1 CI

on:
  pull_request:
    paths:
      - "supabase/migrations/20260822120000_gate_b1_authority_coordination.sql"
      - "supabase/tests/database/gate_b1.test.sql"
      - "scripts/check-gate-b1-concurrency.sh"
      - "GATE-B1-RESULT.md"
      - ".github/workflows/gate-b1-ci.yml"

permissions:
  contents: read

concurrency:
  group: gate-b1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authority-and-coordination:
    name: Authority, coordination and repeated concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact revision and base history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Use Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Enforce Gate B1 path scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/gate-b1-paths
          if grep -Ev '^(.github/workflows/gate-b1-ci.yml|GATE-B1-RESULT.md|scripts/check-gate-b1-concurrency.sh|supabase/migrations/20260822120000_gate_b1_authority_coordination.sql|supabase/tests/database/gate_b1.test.sql)$' /tmp/gate-b1-paths; then
            echo "Gate B1 changed a path outside the authorized allowlist" >&2
            exit 1
          fi
          if grep -E '^(apps/web/|package(-lock)?\.json$)' /tmp/gate-b1-paths; then
            echo "Gate B1 must not change frontend or dependency manifests" >&2
            exit 1
          fi
      - name: Install Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.115.0
      - name: Start isolated local stack
        run: supabase start -x vector,logflare
      - name: Reset from migrations and seed
        run: supabase db reset --local
      - name: Run Gate 1 regression and Gate B1 pgTAP
        run: supabase test db
      - name: Repeat real S7 concurrency
        env:
          B1_CONCURRENCY_ITERATIONS: "10"
        run: ./scripts/check-gate-b1-concurrency.sh
